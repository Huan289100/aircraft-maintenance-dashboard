<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aircraft Maintenance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f7fb;
  color:#172033
}
.wrap{
  max-width:1400px;
  margin:auto;
  padding:24px
}
.hero{
  background:linear-gradient(135deg,#4b146d,#8b2f91);
  color:white;
  padding:24px;
  border-radius:18px
}
.hero h1{margin:0 0 6px}

.controls,.cards{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:18px 0
}

.controls select,.controls input{
  padding:12px;
  border:1px solid #ccd3df;
  border-radius:10px;
  background:white;
  min-width:180px
}
.controls input{flex:1}

.card{
  background:white;
  padding:16px;
  border-radius:14px;
  box-shadow:0 3px 14px #0001;
  min-width:150px
}
.card b{
  display:block;
  font-size:25px;
  margin-top:5px
}

.charts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;
  margin:18px 0
}

.chartcard{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 3px 14px #0001;
  text-align:center
}
.chartcard h2{
  margin:0 0 4px;
  font-size:20px
}
.charttotal{
  font-weight:bold;
  margin:4px 0 12px;
  color:#54206e
}
.chartwrap{
  position:relative;
  height:390px;
  max-width:520px;
  margin:auto
}

.tablebox{
  background:white;
  border-radius:14px;
  overflow:auto;
  box-shadow:0 3px 14px #0001
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1050px
}

th,td{
  padding:10px;
  border-bottom:1px solid #edf0f5;
  text-align:left;
  font-size:13px
}

th{
  background:#54206e;
  color:white;
  position:sticky;
  top:0
}

.pill{
  padding:4px 8px;
  border-radius:999px;
  background:#eef1f6
}

.foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px
}
.foot button{
  padding:9px 14px;
  border:0;
  border-radius:9px
}

.muted{
  opacity:.8;
  font-size:13px
}

.err{
  background:#fff0f0;
  color:#9d1c1c;
  padding:14px;
  border-radius:10px;
  margin-top:15px
}

@media(max-width:600px){
  .wrap{padding:12px}
  .hero{padding:18px}
  .charts{grid-template-columns:1fr}
  .chartwrap{height:350px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
  <h1>Aircraft Maintenance Dashboard</h1>
  <div>
    Multi-Aircraft Order Status •
    Data source: Aircraft_Maintenance_Data.xlsx
  </div>
  <div id="updated" class="muted"></div>
</div>

<div class="controls">

<select id="aircraft"></select>

<select id="status" aria-label="Status"></select>
<label>Order Type (G)<br><select id="orderType" aria-label="Order Type column G"></select></label>
<label>Working Group (R)<br><select id="workingGroup" aria-label="Working Group column R"></select></label>
<label>External Ident. (U)<br><select id="externalIdent" aria-label="External Ident. column U"></select></label>
<label>AD Note (Q)<br><select id="adNote" aria-label="AD Note column Q"></select></label>

<input
  id="search"
  placeholder="ค้นหา Order / Activity / Revision / Description / Work Center / AD Note / Order Type / Working Group / External Ident."
>

</div>

<div id="cards" class="cards"></div>

<div id="charts" class="charts"></div>

<div id="error"></div>

<div class="tablebox">

<table>

<thead>
<tr>
<th>Item</th>
<th>Revision</th>
<th>Order</th>
<th>Order Type (G)</th>
<th>Activity</th>
<th>Oper.WorkCenter</th>
<th>Description</th>
<th>Status</th>
<th>AD Note (Q)</th>
<th>Working Group (R)</th>
<th>External Ident. (U)</th>
<th>Main WorkCtr</th>
</tr>
</thead>

<tbody id="body"></tbody>

</table>

</div>

<div class="foot">
<button id="prev">◀ Previous</button>
<span id="page"></span>
<button id="next">Next ▶</button>
</div>

</div>

<script>

Chart.register(ChartDataLabels);

/* =========================================================
   EXCEL FILE
   ========================================================= */

const FILE='Aircraft_Maintenance_Data.xlsx';


/* =========================================================
   STATUS
   ========================================================= */

const STATUS_ORDER=[
  'REL',
  'TECO',
  'Wait LB-B TECO',
  'Wait LAE Sign',
  'Wait MECH Sign'
];

const STATUS_COLORS={
  'REL':'#16a34a',
  'TECO':'#dc2626',
  'Wait LB-B TECO':'#f59e0b',
  'Wait LAE Sign':'#2563eb',
  'Wait MECH Sign':'#9333ea'
};


/* =========================================================
   VARIABLES
   ========================================================= */

let book={};
let page=1;
let per=15;
let charts={};

const $=id=>document.getElementById(id);


/* =========================================================
   SAFE TEXT
   ========================================================= */

function esc(v){

  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));

}


/* =========================================================
   NORMALIZE EXCEL ROW
   ========================================================= */

function norm(row){

  return{

    item:row['Item'],

    revision:row['Revision'],

    order:row['Order'],

    orderType:String(row.__columnG??'').trim(),

    adNote:String(row.__columnQ??'').trim(),

    activity:row['Activity'],

    wc:row['Oper.WorkCenter'],

    desc:row['Description'],

    status:String(row['Syste']??'').trim(),

    wg:String(row.__columnR??'').trim(),

    externalIdent:String(row.__columnU??'').trim(),

    main:row['Main WorkCtr']

  };

}


/* =========================================================
   CURRENT AIRCRAFT
   ========================================================= */

function current(){

  return book[$('aircraft').value] || [];

}


/* =========================================================
   STATUS LIST
   ========================================================= */

function statuses(){

  let found=[
    ...new Set(
      current()
      .map(r=>r.status)
      .filter(Boolean)
    )
  ];

  return [

    ...STATUS_ORDER.filter(
      s=>found.includes(s)
    ),

    ...found.filter(
      s=>!STATUS_ORDER.includes(s)
    )

  ];

}


/* =========================================================
   STATUS SELECT
   ========================================================= */

function syncStatus(){

  let old=$('status').value;

  let ss=[
    ...STATUS_ORDER,
    ...statuses().filter(
      s=>!STATUS_ORDER.includes(s)
    )
  ];

  $('status').innerHTML=

    '<option value="">ALL STATUS</option>' +

    ss.map(
      s=>`<option value="${esc(s)}">${esc(s)}</option>`
    ).join('');

  if(ss.includes(old)){
    $('status').value=old;
  }

}


/* =========================================================
   FILTER
   ========================================================= */

function syncExtraFilters(){
  for(const [id,key,label] of [
    ['orderType','orderType','ALL ORDER TYPES'],
    ['adNote','adNote','ALL AD NOTES'],
    ['workingGroup','wg','ALL WORKING GROUPS'],
    ['externalIdent','externalIdent','ALL EXTERNAL IDENT.']
  ]){
    const select=$(id), old=select.value;
    const values=[...new Set(current().map(r=>r[key]))]
      .sort((a,b)=>a.localeCompare(b,'th',{numeric:true}));
    select.innerHTML='<option value="">'+label+'</option>'+
      values.map(v=>`<option value="${esc(JSON.stringify(v))}">${esc(v || '(ว่าง)')}</option>`).join('');
    if(values.some(v=>JSON.stringify(v)===old)) select.value=old;
  }
}

function filtered(){

  let q=
    $('search')
    .value
    .trim()
    .toLowerCase();

  let s=
    $('status').value;

  const type=$('orderType').value, note=$('adNote').value;
  const group=$('workingGroup').value, external=$('externalIdent').value;

  return current().filter(r=>

    (!s || r.status===s)

    && (!type || r.orderType===JSON.parse(type))
    && (!note || r.adNote===JSON.parse(note))
    && (!group || r.wg===JSON.parse(group))
    && (!external || r.externalIdent===JSON.parse(external))

    &&

    (!q || [

      r.order,
      r.activity,
      r.revision,
      r.desc,
      r.wc,
      r.wg,
      r.main,
      r.adNote,
      r.orderType,
      r.externalIdent

    ].some(v=>

      String(v??'')
      .toLowerCase()
      .includes(q)

    ))

  );

}


/* =========================================================
   CHARTS
   AUTO DETECT ALL SHEETS
   ========================================================= */

function renderCharts(){

  Object.values(charts)
    .forEach(c=>c.destroy());

  charts={};


  /*
     IMPORTANT

     ไม่ล็อก TEW / TQM / TEV อีกต่อไป

     ระบบจะ Detect Sheet
     จาก Excel อัตโนมัติ
  */

  let names = Object.keys(book);


  $('charts').innerHTML=

    names.map(n=>`

      <div class="chartcard">

        <h2>
          HS-${esc(n)} STATUS
        </h2>

        <div class="charttotal">
          TOTAL ${book[n].length} ORDERS
        </div>

        <div class="chartwrap">
          <canvas id="chart_${esc(n)}"></canvas>
        </div>

      </div>

    `).join('');


  names.forEach(n=>{

    const rows=book[n];

    const found=[
      ...new Set(
        rows
        .map(r=>r.status)
        .filter(Boolean)
      )
    ];


    const labels=[

      ...STATUS_ORDER.filter(
        s=>found.includes(s)
      ),

      ...found.filter(
        s=>!STATUS_ORDER.includes(s)
      )

    ];


    const data=

      labels.map(s=>

        rows.filter(
          r=>r.status===s
        ).length

      );


    const total=

      data.reduce(
        (a,b)=>a+b,
        0
      );


    const centerText={

      id:'centerText_'+n,

      afterDraw(chart){

        const {
          ctx,
          chartArea
        }=chart;

        if(!chartArea) return;


        const x=
          (chartArea.left+
           chartArea.right)/2;

        const y=
          (chartArea.top+
           chartArea.bottom)/2;


        ctx.save();

        ctx.textAlign='center';

        ctx.textBaseline='middle';

        ctx.fillStyle='#172033';

        ctx.font='bold 28px Arial';

        ctx.fillText(
          total,
          x,
          y-8
        );


        ctx.font='12px Arial';

        ctx.fillStyle='#667085';

        ctx.fillText(
          'TOTAL',
          x,
          y+18
        );

        ctx.restore();

      }

    };


    charts[n]=new Chart(

      document.getElementById(
        'chart_'+n
      ),

      {

        type:'doughnut',

        data:{

          labels:labels,

          datasets:[{

            data:data,

            backgroundColor:

              labels.map(
                s=>
                STATUS_COLORS[s]
                || '#64748b'
              ),

            borderColor:'#ffffff',

            borderWidth:3,

            hoverOffset:8

          }]

        },


        plugins:[
          centerText
        ],


        options:{

          responsive:true,

          maintainAspectRatio:false,

          cutout:'58%',


          layout:{

            padding:{
              top:62,
              right:55,
              bottom:36,
              left:55
            }

          },


          plugins:{

            legend:{

              position:'bottom',

              labels:{

                padding:14,

                usePointStyle:true,

                generateLabels:(chart)=>{

                  const ds=
                    chart.data.datasets[0];

                  const sum=
                    ds.data.reduce(
                      (a,b)=>a+b,
                      0
                    );


                  return chart.data.labels.map(
                    (label,i)=>{

                      const value=
                        ds.data[i];

                      const pct=
                        sum
                        ? (value*100/sum).toFixed(2)
                        : '0.00';


                      return{

                        text:
                          `${label} = ${value} (${pct}%)`,

                        fillStyle:
                          ds.backgroundColor[i],

                        strokeStyle:
                          ds.backgroundColor[i],

                        fontColor:'#172033',

                        hidden:false,

                        index:i,

                        pointStyle:'circle'

                      };

                    }
                  );

                }

              }

            },


            datalabels:{

              color:'#172033',

              backgroundColor:
                'rgba(255,255,255,.96)',

              borderColor:'#d0d5dd',

              borderWidth:1,

              borderRadius:6,

              padding:{
                top:5,
                bottom:5,
                left:7,
                right:7
              },


              anchor:'end',

              align:'end',


              offset:(ctx)=>{

                const value=
                  ctx.dataset.data[
                    ctx.dataIndex
                  ];

                const sum=
                  ctx.dataset.data.reduce(
                    (a,b)=>a+b,
                    0
                  );

                const pct=
                  sum
                  ? value*100/sum
                  : 0;


                if(pct < 0.75)
                  return 54;

                if(pct < 1.5)
                  return 34;

                if(pct < 3)
                  return 18;

                return 7;

              },


              clamp:false,

              clip:false,


              display:(ctx)=>{

                const value=
                  ctx.dataset.data[
                    ctx.dataIndex
                  ];

                const sum=
                  ctx.dataset.data.reduce(
                    (a,b)=>a+b,
                    0
                  );

                const pct=
                  sum
                  ? value*100/sum
                  : 0;

                return pct >= 3;

              },


              formatter:(value,ctx)=>{

                const sum=
                  ctx.chart.data
                  .datasets[0]
                  .data
                  .reduce(
                    (a,b)=>a+b,
                    0
                  );

                const pct=
                  sum
                  ? (value*100/sum)
                    .toFixed(2)
                  : '0.00';

                return `${value} • ${pct}%`;

              },


              font:{
                weight:'bold',
                size:10
              }

            },


            tooltip:{

              callbacks:{

                label:(ctx)=>{

                  const pct=
                    total
                    ? (ctx.raw*100/total)
                      .toFixed(2)
                    : '0.00';

                  return
                    ` ${ctx.label}: ${ctx.raw} (${pct}%)`;

                }

              }

            }

          }

        }

      }

    );

  });

}


/* =========================================================
   CARDS + TABLE
   ========================================================= */

function render(){

  let all=current();

  let f=filtered();


  let ss=[

    ...STATUS_ORDER,

    ...statuses().filter(
      s=>!STATUS_ORDER.includes(s)
    )

  ];


  $('cards').innerHTML=

    `<div class="card">
       TOTAL
       <b>${all.length}</b>
     </div>`

    +

    ss.map(s=>

      `<div class="card">

        ${esc(s)}

        <b>
          ${
            all.filter(
              x=>x.status===s
            ).length
          }
        </b>

       </div>`

    ).join('')

    +

    `<div class="card">
       DISPLAY
       <b>${f.length}</b>
     </div>`;


  let pages=
    Math.max(
      1,
      Math.ceil(
        f.length/per
      )
    );


  if(page>pages){
    page=pages;
  }


  let a=
    (page-1)*per;


  $('body').innerHTML=

    f.slice(
      a,
      a+per
    )

    .map(r=>`

      <tr>

       <td>${esc(r.item)}</td>

       <td>${esc(r.revision)}</td>

       <td>
        <b>${esc(r.order)}</b>
       </td>

       <td>${esc(r.orderType)}</td>

       <td>${esc(r.activity)}</td>

       <td>${esc(r.wc)}</td>

       <td>${esc(r.desc)}</td>

       <td>
        <span class="pill">
         ${esc(r.status)}
        </span>
       </td>

       <td>${esc(r.adNote)}</td>

       <td>${esc(r.wg)}</td>

       <td>${esc(r.externalIdent)}</td>

       <td>${esc(r.main)}</td>

      </tr>

    `).join('');


  $('page').textContent=
    `Page ${page} / ${pages}`;


  $('prev').disabled=
    page<=1;


  $('next').disabled=
    page>=pages;

}


/* =========================================================
   LOAD EXCEL
   ========================================================= */

async function load(){

  try{

    /*
       Date.now()
       ป้องกัน Browser ใช้ Excel เก่าจาก Cache
    */

    let res=
      await fetch(
        FILE+'?v='+Date.now()
      );


    if(!res.ok){

      throw new Error(
        'ไม่พบ '+FILE
      );

    }


    let ab=
      await res.arrayBuffer();


    let wb=
      XLSX.read(
        ab,
        {type:'array'}
      );


    /*
       AUTO DETECT SHEET

       อ่าน Sheet ทุก Sheet
       จาก Excel โดยอัตโนมัติ
    */

    wb.SheetNames.forEach(n=>{

      let rows=

        XLSX.utils.sheet_to_json(

          wb.Sheets[n],

          {
            range:6,
            defval:''
          }

        );


      // Read physical columns G and Q: Q currently shares the Priority header with P.
      const physicalRows=XLSX.utils.sheet_to_json(wb.Sheets[n],{
        range:6, header:1, defval:'', blankrows:false
      }).slice(1);
      rows.forEach((row,i)=>{
        row.__columnG=physicalRows[i]?.[6] ?? '';
        row.__columnQ=physicalRows[i]?.[16] ?? '';
        row.__columnR=physicalRows[i]?.[17] ?? '';
        row.__columnU=physicalRows[i]?.[20] ?? '';
      });

      /*
         เก็บเฉพาะ Sheet
         ที่มีข้อมูล Order
         หรือ Description
      */

      let validRows=

        rows.filter(
          r=>
          r['Order']
          ||
          r['Description']
        );


      /*
         ถ้า Sheet มีข้อมูลจริง
         จึงนำไปแสดง Dashboard
      */

      if(validRows.length>0){

        book[n]=
          validRows.map(norm);

      }

    });


    /*
       AIRCRAFT DROPDOWN
       สร้างจากชื่อ Sheet อัตโนมัติ
    */

    $('aircraft').innerHTML=

      Object.keys(book)

      .map(n=>

        `<option value="${esc(n)}">
          HS-${esc(n)}
         </option>`

      )

      .join('');


    /*
       ถ้าไม่มี Sheet ที่ใช้งานได้
    */

    if(
      Object.keys(book).length===0
    ){

      throw new Error(
        'ไม่พบ Sheet ที่มีข้อมูล Aircraft'
      );

    }


    syncStatus();
  syncExtraFilters();


    $('updated').textContent=

      'Loaded ' +

      new Date()
      .toLocaleString('th-TH');


    /*
       สร้างกราฟทุก Aircraft
    */

    renderCharts();


    /*
       แสดงตาราง Aircraft แรก
    */

    render();


  }

  catch(e){

    $('error').innerHTML=

      '<div class="err">' +

      esc(e.message) +

      ' — ตรวจว่าไฟล์ Aircraft_Maintenance_Data.xlsx ' +

      'อยู่ใน GitHub repository เดียวกับ index.html' +

      '</div>';

  }

}


/* =========================================================
   EVENTS
   ========================================================= */

$('aircraft').onchange=()=>{

  page=1;

  syncStatus();
  syncExtraFilters();

  render();

};


$('status').onchange=()=>{

  page=1;

  render();

};


for(const id of ['orderType','adNote','workingGroup','externalIdent']){
  $(id).onchange=()=>{page=1;render();};
}

$('search').oninput=()=>{

  page=1;

  render();

};


$('prev').onclick=()=>{

  page--;

  render();

};


$('next').onclick=()=>{

  page++;

  render();

};


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
